<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | PesaPlan</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>

      <main class="content">
        <h1 class="sr-only">Dashboard</h1>

        <!-- Summary cards + primary action -->
        <section class="dash-top">
          <div class="grid cols-2" id="stats">
            <div class="card skeleton" style="height:112px"></div>
            <div class="card skeleton" style="height:112px"></div>
            <div class="card skeleton" style="height:112px"></div>
            <div class="card skeleton" style="height:112px"></div>
          </div>
          <a class="btn btn-primary dash-add" href="add-transaction.html">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Transaction
          </a>
        </section>

        <!-- Charts row -->
        <section class="grid cols-3">
          <article class="card">
            <div class="card-header">
              <h2>Income vs Expenses</h2>
              <span class="badge neutral" id="period-badge"></span>
            </div>
            <div id="weekly-chart"></div>
          </article>

          <article class="card">
            <div class="card-header"><h2>Expenses Breakdown</h2></div>
            <div class="breakdown">
              <div id="expense-donut"></div>
              <div class="breakdown-list" id="expense-list"></div>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <h2>Budget Utilization</h2>
              <a class="small" href="budgets.html">Manage</a>
            </div>
            <div id="budget-list"></div>
          </article>
        </section>

        <!-- Lists row -->
        <section class="grid dash-bottom">
          <article class="card">
            <div class="card-header">
              <h2>Recent Transactions</h2>
              <a class="small" href="transactions.html">View All</a>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="right">Amount</th></tr>
                </thead>
                <tbody id="recent-body"></tbody>
              </table>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <h2>Savings Goals</h2>
              <a class="small" href="savings.html">View All</a>
            </div>
            <div id="goal-list"></div>
          </article>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/dashboard.js"></script>
</body>
</html>
