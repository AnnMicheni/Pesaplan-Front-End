<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions | PesaPlan</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>

      <main class="content">
        <div class="page-header">
          <div>
            <h1>Transactions</h1>
            <p>Every shilling in and out, in one place.</p>
          </div>
          <a class="btn btn-primary" href="add-transaction.html">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add Transaction
          </a>
        </div>

        <section class="card">
          <!-- Filter Transactions (extends View Transactions) -->
          <form class="filters" id="filters">
            <div class="field">
              <label for="f-q">Search</label>
              <input class="input" id="f-q" name="q" type="search" placeholder="Description or category">
            </div>
            <div class="field">
              <label for="f-type">Type</label>
              <select class="select" id="f-type" name="type">
                <option value="">All types</option>
                <option value="INCOME">Income</option>
                <option value="EXPENSE">Expense</option>
              </select>
            </div>
            <div class="field">
              <label for="f-category">Category</label>
              <select class="select" id="f-category" name="categoryId">
                <option value="">All categories</option>
              </select>
            </div>
            <div class="field">
              <label for="f-from">From</label>
              <input class="input" id="f-from" name="from" type="date">
            </div>
            <div class="field">
              <label for="f-to">To</label>
              <input class="input" id="f-to" name="to" type="date">
            </div>
            <button class="btn" type="reset" id="clear-filters">Clear</button>
          </form>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th><th>Description</th><th>Category</th><th>Payment method</th>
                  <th>Type</th><th class="right">Amount</th><th class="right"><span class="sr-only">Actions</span></th>
                </tr>
              </thead>
              <tbody id="tx-body"></tbody>
            </table>
          </div>
          <div class="table-footer" id="tx-footer"></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/transactions.js"></script>
</body>
</html>
