<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | PesaPlan</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>

      <main class="content">
        <div class="page-header">
          <div>
            <h1>Profile</h1>
            <p>Manage your personal information and account preferences.</p>
          </div>
        </div>

        <div class="profile-layout">
          <section class="card profile-card">
            <div class="avatar" id="p-avatar"></div>
            <div class="name" id="p-name"></div>
            <div class="small muted" id="p-email"></div>
            <div class="small faint" id="p-since"></div>
            <div class="profile-stats">
              <div><strong id="p-tx">...</strong><span class="small faint">Transactions</span></div>
              <div><strong id="p-goals">...</strong><span class="small faint">Savings goals</span></div>
            </div>
          </section>

          <section class="card">
            <div class="card-header">
              <div>
                <h2>Personal information</h2>
                <p>Update your personal details here</p>
              </div>
              <button class="btn" id="edit-toggle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                Edit profile
              </button>
            </div>

            <form id="profile-form" novalidate>
              <fieldset id="profile-fields" disabled style="border:none;padding:0;margin:0">
                <div class="form-grid">
                  <div class="field">
                    <label for="firstName">First name</label>
                    <input class="input" id="firstName" name="firstName" autocomplete="given-name">
                  </div>
                  <div class="field">
                    <label for="lastName">Last name</label>
                    <input class="input" id="lastName" name="lastName" autocomplete="family-name">
                  </div>
                  <div class="field">
                    <label for="email">Email address</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="email">
                  </div>
                  <div class="field">
                    <label for="phone">Phone number</label>
                    <input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+254 7XX XXX XXX">
                  </div>
                  <div class="field">
                    <label for="country">Country</label>
                    <select class="select" id="country" name="country">
                      <option>Kenya</option><option>Uganda</option><option>Tanzania</option>
                      <option>Rwanda</option><option>Ethiopia</option><option>Other</option>
                    </select>
                  </div>
                  <div class="field">
                    <label for="currency">Preferred currency</label>
                    <select class="select" id="currency" name="currency"></select>
                  </div>
                </div>
              </fieldset>
              <div class="form-actions" id="form-actions" hidden>
                <button type="button" class="btn" id="cancel-edit">Cancel</button>
                <button type="submit" class="btn btn-primary" id="save-profile">Save changes</button>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="../assets/js/pages/profile.js"></script>
</body>
</html>
